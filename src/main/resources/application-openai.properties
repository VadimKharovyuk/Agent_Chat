# application-openai.properties
spring.profiles.active=openai
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.chat.model=${CHAT_MODEL:deepseek/deepseek-chat}
spring.ai.agent.chat.model=${AGENT_MODEL:deepseek/deepseek-chat}
app.agent.experiment.enabled=false