<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новий розговор</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 700px;">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">🤖 Новий розмова</h4>
        <a href="/admin/experiment" class="btn btn-outline-secondary btn-sm">← Назад</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form action="/admin/experiment/start" method="post">

                <!-- Тема -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Тема розмови</label>
                    <textarea name="topic" id="topicInput"
                              class="form-control" rows="2"
                              placeholder="Як AI змінить світ через 10 років?" required></textarea>
                    <div class="d-flex justify-content-between align-items-center mt-1">
                        <small class="text-muted">або AI придумає тему на основі свіжих новин</small>
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                                id="generateTopicBtn">
                            🎲 Згенерувати тему
                        </button>
                    </div>
                </div>

                <!-- Промпти -->
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label class="form-label fw-semibold mb-0">Промпти агентів</label>
                    <button type="button" class="btn btn-outline-primary btn-sm"
                            id="generatePromptsBtn">
                        ✨ Згенерувати промпти по темі
                    </button>
                </div>

                <div class="mb-3">
                    <label class="form-label">🎓 Промпт агента A</label>
                    <textarea name="systemPromptA" id="promptA"
                              class="form-control" rows="5"
                              th:text="${defaultPromptA}"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">🚀 Промпт агента B</label>
                    <textarea name="systemPromptB" id="promptB"
                              class="form-control" rows="5"
                              th:text="${defaultPromptB}"></textarea>
                </div>

                <!-- Раунди -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Макс. раундів</label>
                    <input type="number" name="maxRounds" class="form-control"
                           value="10" min="1" max="100" style="width: 120px;">
                </div>

                <button type="submit" class="btn btn-primary">▶ Запустити</button>

            </form>
        </div>
    </div>

</div>

<script>
    // Генерація теми
    document.getElementById('generateTopicBtn').addEventListener('click', async () => {
        const btn = document.getElementById('generateTopicBtn');
        btn.disabled = true;
        btn.textContent = '⏳ Генерую...';
        try {
            const res = await fetch('/admin/experiment/generate-topic');
            document.getElementById('topicInput').value = await res.text();
        } catch (e) {
            alert('Помилка генерації теми');
        } finally {
            btn.disabled = false;
            btn.textContent = '🎲 Згенерувати тему';
        }
    });

    // Генерація промптів
    document.getElementById('generatePromptsBtn').addEventListener('click', async () => {
        const btn = document.getElementById('generatePromptsBtn');
        const topic = document.getElementById('topicInput').value.trim();

        if (!topic) {
            alert('Спочатку введи або згенеруй тему!');
            return;
        }

        btn.disabled = true;
        btn.textContent = '⏳ Генерую...';

        try {
            const res = await fetch('/admin/experiment/generate-prompts?topic='
                + encodeURIComponent(topic));
            const data = await res.json();
            document.getElementById('promptA').value = data.promptA;
            document.getElementById('promptB').value = data.promptB;
        } catch (e) {
            alert('Помилка генерації промптів');
        } finally {
            btn.disabled = false;
            btn.textContent = '✨ Згенерувати промпти по темі';
        }
    });
</script>
</body>
</html>
